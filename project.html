<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Lucky Draw - Check Your Win</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{
  min-height:100vh;
  background: radial-gradient(circle at top, #2c2c2c, #0a0a0a);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  width:100%;max-width:400px;
  background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:24px;
  padding:30px;
  text-align:center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,215,0,0.08);
}
.badge{
  display:inline-block;
  background: linear-gradient(90deg, #FFD700, #FFA500);
  color:#000;font-size:11px;font-weight:700;
  padding:6px 14px;border-radius:100px;
  letter-spacing:2px;margin-bottom:15px;
}
h1{color:#fff;font-size:26px;font-weight:700;margin-bottom:8px}
p.sub{color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:25px}
.input-box{
  background:rgba(0,0,0,0.4);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:14px;
  padding:16px;
  width:100%;
  color:#FFD700;
  font-size:22px;letter-spacing:6px;
  text-align:center;outline:none;
  transition:0.3s;
}
.input-box:focus{border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,0.2)}
.btn{
  width:100%;margin-top:18px;
  background: linear-gradient(90deg, #FFD700, #FFB700);
  color:#000;border:none;
  padding:16px;border-radius:14px;
  font-size:15px;font-weight:700;
  letter-spacing:1px;cursor:pointer;
  transition:0.3s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,215,0,0.3)}
.result{margin-top:22px;padding:16px;border-radius:12px;display:none;font-size:14px;font-weight:500}
.result.win{display:block;background:rgba(0,255,100,0.1);border:1px solid rgba(0,255,100,0.3);color:#00ff88}
.result.lose{display:block;background:rgba(255,50,50,0.08);border:1px solid rgba(255,50,50,0.2);color:#ff6b6b}
.small{color:rgba(255,255,255,0.3);font-size:10px;margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <div class="badge">PREMIUM ACCESS</div>
  <h1>වාසනාව පරීක්ෂා කරන්න</h1>
  <p class="sub">ඔබේ දුරකථන අංකයේ අවසන් ඉලක්කම් 5 ඇතුලත් කරන්න</p>
  
  <input id="pinInput" class="input-box" type="tel" maxlength="5" placeholder="•••••">
  <button class="btn" onclick="checkPin()">CHECK NOW</button>
  
  <div id="resultBox" class="result"></div>
  <p class="small">Secure & Encrypted Verification</p>
</div>

<script>
const winningPins = ["12345", "56373", "64829"];

function checkPin(){
  const input = document.getElementById('pinInput').value.trim();
  const resultBox = document.getElementById('resultBox');
  
  if(input.length !== 5){
    resultBox.className = "result lose";
    resultBox.style.display = "block";
    resultBox.innerHTML = "⚠️ කරුණාකර ඉලක්කම් 5ක් ඇතුලත් කරන්න";
    return;
  }
  
  if(winningPins.includes(input)){
    resultBox.className = "result win";
    resultBox.innerHTML = "🎉 සුබ පැතුම්! ඔබ දිනා ඇත!<br><b>PIN එක හරි!</b> -  " + input;
  } else {
    resultBox.className = "result lose";
    resultBox.innerHTML = "😔 සමාවන්න, මෙම PIN එක දිනා නැත.<br>නැවත උත්සාහ කරන්න.";
  }
}
</script>
</body>
</html>
