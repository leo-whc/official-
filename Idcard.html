<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo ID Card Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>body{background:#0A1931;color:#fff;font-family:'Outfit',sans-serif;margin:0}input,select{width:100%;margin-top:6px;background:rgba(0,0,0,0.4);border:1.5px solid rgba(255,215,0,0.3);border-radius:10px;padding:12px;color:#fff;font-size:12px}</style>
</head>
<body>

<nav style="display:flex;justify-content:space-between;padding:14px 24px;background:#0A1F44;border-bottom:2px solid #FFD700">
  <div style="color:#FFD700;font-weight:900">🪪 LEO GOLD ID CARD</div>
  <button onclick="location.href='index.html'" style="border:1px solid #C9A86A;color:#E6C875;padding:8px 16px;border-radius:100px;background:rgba(255,255,255,0.06)">← Home</button>
</nav>

<div style="max-width:1100px;margin:0 auto;padding:20px">
  <h2 style="color:#FFD700;font-family:'Playfair Display';font-size:26px">🪪 Gold ID Card Generator</h2>

  <div style="display:grid;grid-template-columns:340px 1fr 1fr;gap:20px;margin-top:16px">

    <!-- FORM -->
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(201,168,106,0.2);border-radius:16px;padding:18px">
      <label style="color:#FFD700;font-size:10px;font-weight:800">NAME *</label>
      <input id="idName" placeholder="Leo Ashen Perera" oninput="drawID()">

      <label style="color:#FFD700;font-size:10px;font-weight:800;margin-top:10px;display:block">LEO ID *</label>
      <input id="idNumber" value="LEO-GOLD-2024-001" oninput="drawID()">

      <label style="color:#FFD700;font-size:10px;font-weight:800;margin-top:10px;display:block">POSITION</label>
      <select id="idPos" onchange="drawID()">
        <option>GOLD MEMBER</option>
        <option>FOUNDING MEMBER</option>
        <option>PRESIDENT</option>
        <option>VICE PRESIDENT</option>
        <option>SECRETARY</option>
        <option>TREASURER</option>
        <option>DIRECTOR</option>
        <option>MEADIA DIRECTOR</option>
      </select>

      <label style="color:#FFD700;font-size:10px;font-weight:800;margin-top:10px;display:block">BLOOD GROUP</label>
      <select id="idBlood" onchange="drawID()">
        <option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option></option>
      </select>

      <label style="color:#FFD700;font-size:10px;font-weight:800;margin-top:10px;display:block">VALID TILL</label>
      <input id="idValid" type="month" value="2025-12">

      <label style="color:#FFD700;font-size:10px;font-weight:800;margin-top:10px;display:block">PHOTO (optional)</label>
      <input type="file" id="idPhoto" accept="image/*" onchange="loadPhoto(event)" style="font-size:10px">

      <button onclick="downloadFront()" style="width:100%;margin-top:16px;background:linear-gradient(90deg,#FFD700,#FFC400);color:#000;padding:13px;border-radius:100px;border:none;font-weight:900;cursor:pointer">📥 Download Front</button>
      <button onclick="downloadBack()" style="width:100%;margin-top:8px;background:transparent;border:1.5px solid #FFD700;color:#FFD700;padding:11px;border-radius:100px;font-weight:800;font-size:12px;cursor:pointer">📥 Download Back</button>
      <button onclick="downloadBoth()" style="width:100%;margin-top:8px;background:#0A1F44;border:1px solid rgba(255,215,0,0.3);color:#fff;padding:11px;border-radius:100px;font-weight:700;font-size:11px;cursor:pointer">📦 Download Both as ZIP (Front+Back)</button>

      <p id="status" style="color:#22C55E;font-size:11px;text-align:center;margin-top:10px;display:none">✅ Downloaded!</p>
    </div>

    <!-- FRONT PREVIEW -->
    <div>
      <p style="color:#8DA2C3;font-size:10px;letter-spacing:2px;text-align:center">FRONT SIDE</p>
      <canvas id="frontCanvas" width="540" height="860" style="width:100%;border-radius:18px;margin-top:8px;box-shadow:0 20px 50px rgba(0,0,0,0.6)"></canvas>
    </div>

    <!-- BACK PREVIEW -->
    <div>
      <p style="color:#8DA2C3;font-size:10px;letter-spacing:2px;text-align:center">BACK SIDE - WITH CHANNEL QR</p>
      <canvas id="backCanvas" width="540" height="860" style="width:100%;border-radius:18px;margin-top:8px;box-shadow:0 20px 50px rgba(0,0,0,0.6)"></canvas>
    </div>

  </div>
</div>

<script>
const front = document.getElementById('frontCanvas'); const f = front.getContext('2d');
const back = document.getElementById('backCanvas'); const b = back.getContext('2d');
let userImg = null;

function loadPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{ userImg = new Image(); userImg.onload=drawID; userImg.src=ev.target.result; };
  reader.readAsDataURL(file);
}

function drawID(){
  const name = document.getElementById('idName').value || 'Leo Ashen Perera';
  const idNum = document.getElementById('idNumber').value || 'LEO-GOLD-2024-001';
  const pos = document.getElementById('idPos').value;
  const blood = document.getElementById('idBlood').value;
  const valid = document.getElementById('idValid').value || '2025-12';

  // --- FRONT ---
  // bg
  let grad = f.createLinearGradient(0,0,0,860);
  grad.addColorStop(0,'#0A1931'); grad.addColorStop(1,'#0A1F44');
  f.fillStyle=grad; f.fillRect(0,0,540,860);
  // gold top
  let gold = f.createLinearGradient(0,0,540,0);
  gold.addColorStop(0,'#FFD700'); gold.addColorStop(0.5,'#FFA500'); gold.addColorStop(1,'#FFD700');
  f.fillStyle=gold; f.fillRect(0,0,540,22);

  // header
  f.fillStyle='#FFD700'; f.font='900 18px Outfit'; f.textAlign='center';
  f.fillText('LEO CLUB OF WHC', 270, 60);
  f.fillStyle='#C9A86A'; f.font='700 10px Outfit'; f.letterSpacing='4px';
  f.fillText('GOLD MEMBER • EST 2024', 270, 78);

  // photo circle
  f.save();
  f.beginPath(); f.arc(270,180,78,0,Math.PI*2); f.clip();
  if(userImg){
    f.drawImage(userImg,192,102,156,156);
  } else {
    f.fillStyle='#1a2a4a'; f.fillRect(192,102,156,156);
    f.fillStyle='#FFD700'; f.font='70px Outfit'; f.fillText('🦁',270,205);
  }
  f.restore();
  // gold ring around photo
  f.strokeStyle='#FFD700'; f.lineWidth=4; f.beginPath(); f.arc(270,180,80,0,Math.PI*2); f.stroke();

  // name
  f.fillStyle='#fff'; f.font='900 26px Playfair Display'; f.textAlign='center';
  f.fillText(name.toUpperCase(), 270, 300);
  // pos badge
  f.fillStyle='#FFD700'; f.beginPath(); f.roundRect(270- (f.measureText(pos).width+30)/2, 315, f.measureText(pos).width+30, 26, 13); f.fill();
  f.fillStyle='#000'; f.font='800 11px Outfit'; f.fillText(pos, 270, 332);

  // details
  f.textAlign='left'; f.fillStyle='#8DA2C3'; f.font='600 11px Outfit';
  f.fillText('LEO ID', 60, 390); f.fillText('BLOOD', 60, 430); f.fillText('VALID TILL', 60, 470);
  f.fillStyle='#fff'; f.font='800 15px Outfit';
  f.fillText(idNum, 60, 410); f.fillText(blood, 60, 450); f.fillText(valid, 60, 490);

  f.textAlign='right'; f.fillStyle='#8DA2C3'; f.font='600 11px Outfit';
  f.fillText('ISSUED', 480, 390);
  f.fillStyle='#fff'; f.font='800 13px Outfit';
  f.fillText(new Date().toLocaleDateString(), 480, 410);

  // footer gold
  f.fillStyle=gold; f.fillRect(0,838,540,22);
  f.fillStyle='#0A1931'; f.font='700 10px Outfit'; f.textAlign='center';
  f.fillText('OFFICIAL GOLD MEMBER ID • NON-TRANSFERABLE', 270, 853);

  // --- BACK ---
  b.fillStyle='#FFFEF5'; b.fillRect(0,0,540,860);
  b.fillStyle=gold; b.fillRect(0,0,540,22); b.fillRect(0,838,540,22);

  b.fillStyle='#0A1931'; b.font='900 16px Outfit'; b.textAlign='center';
  b.fillText('LEO CLUB WHC - GOLD ID', 270, 60);

  // rules
  b.textAlign='left'; b.fillStyle='#0A1931'; b.font='800 12px Outfit';
  b.fillText('TERMS & CONDITIONS:', 40, 100);
  b.fillStyle='#4B5563'; b.font='500 11px Outfit';
  const terms = ['1. This card is property of Leo Club Of WHC','2. Must be returned upon resignation','3. Loss must be reported immediately','4. Misuse will lead to cancellation','5. Valid only with official seal'];
  terms.forEach((t,i)=> b.fillText(t,40,125+i*20));

  // QR area
  b.fillStyle='#0A1931'; b.fillRect(170,240,200,200);
  b.fillStyle='#25D366'; b.font='60px Outfit'; b.textAlign='center';
  b.fillText('💚',270,330);
  b.fillStyle='#fff'; b.font='700 11px Outfit';
  b.fillText('SCAN TO FOLLOW',270,360);
  b.fillText('WHATSAPP CHANNEL',270,375);
  

  b.fillStyle='#0A1931'; b.font='600 10px Outfit';
  b.fillText('https://whatsapp.com/channel/',270,460);
  b.fillText('0029Vb8bIYv17EmtzlqEVC3B',270,475);

  // holder info repeat
  b.fillStyle='#FFD700'; b.beginPath(); b.roundRect(40,500,460,80,12); b.fill();
  b.fillStyle='#000'; b.font='800 13px Outfit'; b.textAlign='left';
  b.fillText(name.toUpperCase(), 60, 525);
  b.font='600 11px Outfit'; b.fillText(`ID: ${idNum} | ${pos} | Blood: ${blood}`, 60, 545);
  b.fillText(`Valid: ${valid}`, 60, 560);

  // emergency
  b.fillStyle='#EF4444'; b.font='800 11px Outfit'; b.textAlign='center';
  b.fillText('⚠️ EMERGENCY: +94 77 123 4567 | leo.colombo@email.com', 270, 620);

  // barcode fake
  b.fillStyle='#000';
  for(let i=0;i<40;i++){ b.fillRect(60+i*11,650, (i%3?3:6), 50); }
  b.fillStyle='#4B5563'; b.font='600 9px Outfit'; b.textAlign='center';
  b.fillText(idNum, 270, 720);

  b.fillStyle='#6B7280'; b.font='500 8px Outfit';
  b.fillText('This is digitally generated ID - Official Gold Member', 270, 815);
}

function downloadFront(){
  const a=document.createElement('a');
  a.download=`${document.getElementById('idName').value||'Leo'}_ID_Front.png`;
  a.href=front.toDataURL('image/png',1.0); a.click(); showStatus();
}
function downloadBack(){
  const a=document.createElement('a');
  a.download=`${document.getElementById('idName').value||'Leo'}_ID_Back.png`;
  a.href=back.toDataURL('image/png',1.0); a.click(); showStatus();
}
function downloadBoth(){
  downloadFront(); setTimeout(downloadBack,500);
}
function showStatus(){
  const s=document.getElementById('status'); s.style.display='block';
  setTimeout(()=>s.style.display='none',3000);
}

// init
document.getElementById('idNumber').value = `LEO-GOLD-${new Date().getFullYear()}-${String(Math.floor(Math.random()*9000)+1000)}`;
drawID();
</script>
</body>
</html>9
