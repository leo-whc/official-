<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#0A1931;
  background-image:
    radial-gradient(800px at 0% 0%, rgba(255,215,0,0.15), transparent),
    radial-gradient(800px at 100% 100%, rgba(0,82,204,0.25), transparent);
  display:flex;align-items:center;justify-content:center;
  padding:15px;font-family:'Outfit',sans-serif;
}
.ad-card{
  width:100%;max-width:480px;
  background:linear-gradient(180deg, #11264F 0%, #0A1931 100%);
  border:2px solid #FFD700;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 0 0 4px rgba(255,215,0,0.15), 0 30px 100px rgba(0,0,0,0.8);
  position:relative;
}
.top-banner{
  background:linear-gradient(90deg, #FFD700, #FFC400);
  color:#0A1931;
  text-align:center;
  padding:10px;
  font-weight:900;
  letter-spacing:4px;
  font-size:12px;
}
.logo-area{
  text-align:center;
  padding:25px 20px 10px;
}
.logo{
  width:70px;height:70px;
  background:linear-gradient(135deg,#FFD700,#FFA500);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;
  font-size:36px;
  box-shadow:0 8px 25px rgba(255,215,0,0.4);
}
.logo-area h1{
  color:#FFD700;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}
.logo-area h2{
  color:#fff;
  font-size:14px;
  letter-spacing:6px;
  opacity:0.7;
  margin-top:2px;
}
.content{
  padding:20px 28px 28px;
  text-align:center;
}
.content h3{
  font-family:'Noto Serif Sinhala';
  color:#fff;
  font-size:24px;
  line-height:1.2;
  margin-bottom:8px;
}
.content p.sub{
  color:#8DA2C3;
  font-size:13px;
  margin-bottom:22px;
}
.prize-pool{
  background:rgba(0,0,0,0.35);
  border:1px dashed rgba(255,215,0,0.4);
  border-radius:14px;
  padding:12px;
  display:flex;
  justify-content:space-around;
  margin-bottom:22px;
}
.prize-pool div{color:#FFD700;font-size:11px;font-weight:800}
.prize-pool div span{display:block;color:#fff;font-size:14px;margin-top:2px}

.input-box{
  width:100%;
  background:#08162F;
  border:2px solid rgba(255,215,0,0.25);
  border-radius:14px;
  padding:18px;
  color:#FFD700;
  font-size:28px;
  font-weight:800;
  letter-spacing:8px;
  text-align:center;
  outline:none;
}
.input-box:focus{border-color:#FFD700;box-shadow:0 0 25px rgba(255,215,0,0.25)}

.btn{
  width:100%;margin-top:16px;
  background:linear-gradient(90deg, #FFD700, #FFC400);
  color:#0A1931;border:none;
  padding:18px;border-radius:14px;
  font-weight:900;font-size:15px;
  letter-spacing:2px;cursor:pointer;
  box-shadow:0 10px 30px rgba(255,215,0,0.3);
  transition:0.2s;
}
.btn:hover{transform:translateY(-2px)}

#result{margin-top:20px;border-radius:16px;display:none;overflow:hidden;animation:pop 0.4s ease}
@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}

.r-head{padding:12px;font-weight:900;font-size:12px;letter-spacing:2px}
.r-body{padding:20px;background:rgba(0,0,0,0.3)}
.p1.r-head{background:linear-gradient(90deg,#FFD700,#FF8C00);color:#000}
.p2.r-head{background:linear-gradient(90deg,#D0D0D0,#8A8A8A);color:#000}
.p3.r-head{background:linear-gradient(90deg,#E6954A,#8B4513);color:#fff}

.footer{
  background:rgba(0,0,0,0.4);
  padding:10px;
  text-align:center;
  color:rgba(255,255,255,0.3);
  font-size:9px;
  letter-spacing:2px;
}
</style>
</head>
<body>
<div class="ad-card">
  <div class="top-banner">★ LEO CLUB OFFICIAL ★ MEGA DRAW 2026 ★</div>

  <div class="logo-area">
  
    <h1>LEO CLUB</h1>
    <h2>W  H   C</h2>
  </div>

  <div class="content">
    <h3>සුපිරි වාසනාවන්තයන්ගේ<br> අංකය පරීක්ෂාව</h3>

    <div class="prize-pool">
      <div>🥇 1ST<span>BLENDER</span></div>
      <div>🥈 2ND<span>HEETER JUG</span></div>
      <div>🥉 3RD<span>MUG SET</span></div>
    </div>

  </div>

  <div class="footer">LEO CLUB INTERNATIONAL • SECURE VERIFICATION • 100% TRUSTED</div>
</div>

<script>
const winners = {
  "1234": { p:1, title:"1ST PLACE - MEGA WINNER", prize:"BLENDER", cls:"p1", icon:"🥇", text:"ප්‍රථම ස්ථානය!" },
  "5637": { p:2, title:"2ND PLACE - SUPER WINNER", prize:"HEETER JUG", cls:"p2", icon:"🥈", text:"දෙවන ස්ථානය!" },

};

function checkWin(){
  const pin = document.getElementById('pinInput').value.trim();
  const box = document.getElementById('resultBox');

  if(pin.length!=4){ box.style.display="block"; box.innerHTML=`<div class="r-body" style="color:#ff8a8a">⚠️ ඉලක්කම් 4ක් ඇතුලත් කරන්න</div>`; return; }

  if(winners[pin]){
    const w = winners[pin];
    box.className = w.cls;
    box.style.display="block";
    box.innerHTML=`
      <div id="result" style="display:block">
        <div class="r-head">${w.icon} ${w.title} ${w.icon}</div>
        <div class="r-body">
          <div style="color:#fff;font-family:'Noto Serif Sinhala';font-size:17px">${w.text} සුබ පැතුම්! 🎉</div>

          <a href="https://wa.me/94773053603?text=LEO CLUB - Mama ${w.title}  dina atha PIN:${pin}" style="display:inline-block;margin-top:14px;background:#FFD700;color:#0A1931;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:900;font-size:12px">CLAIM PRIZE NOW →</a>
        </div>
      </div>
    `;
    // confetti gold
    for(let i=0;i<60;i++){const d=document.createElement('div');d.style.position='fixed';d.style.left=Math.random()*100+'vw';d.style.top='-10px';d.style.width='7px';d.style.height='14px';d.style.background=w.p==1?'#FFD700':w.p==2?'#C0C0C0':'#CD7F32';d.style.animation=`fall ${1.5+Math.random()*2}s linear forwards`;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);}
  } else {
    box.style.display="block";
    box.innerHTML=`<div id="result" style="display:block"><div class="r-body" style="border:1px solid rgba(255,70,70,0.3);border-radius:16px;color:#ff8a8a">😔 <b>${pin}</b> අංකය දිනා නැත<br><span style="font-size:11px">LEO CLUB - නැවත උත්සාහ කරන්න</span></div></div>`;
  }
}
const s=document.createElement('style');s.innerHTML='@keyframes fall{to{transform:translateY(100vh) rotate(720deg)}}';document.head.appendChild(s);
</script>
</body>
</html>
