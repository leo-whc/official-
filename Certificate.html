<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate - Fixed Download</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1931;color:#fff;font-family:'Outfit',sans-serif}
input{width:100%;margin-top:6px;background:rgba(0,0,0,0.4);border:1.5px solid rgba(255,215,0,0.3);border-radius:10px;padding:12px;color:#fff}
</style>
</head>
<body>

<nav style="display:flex;justify-content:space-between;padding:14px 24px;background:#0A1F44;border-bottom:2px solid #C9A86A">
  <div style="color:#C9A86A;font-weight:900">LEO CLUB • FIXED CERTIFICATE</div>
  <button onclick="location.href='index.html'" style="border:1px solid #C9A86A;color:#E6C875;padding:8px 16px;border-radius:100px;background:rgba(255,255,255,0.06)">← Home</button>
</nav>

<div style="max-width:900px;margin:0 auto;padding:20px">
  <h2 style="color:#FFD700;font-family:'Playfair Display'">🎓 Gold Certificate - Fixed Download</h2>

  <div style="display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:16px">

    <!-- FORM -->
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(201,168,106,0.2);border-radius:16px;padding:18px">
      <label style="color:#C9A86A;font-size:10px;font-weight:800">MEMBER NAME *</label>
      <input id="cName" placeholder="Leo Ashen Perera" oninput="drawCert()">
      
      <label style="color:#C9A86A;font-size:10px;font-weight:800;margin-top:12px;display:block">BADGE *</label>
      <input id="cBadge" placeholder="GOLD LEO - FOUNDER" value="GOLD LEO - FOUNDER - 1ST PLACE" oninput="drawCert()">

      <label style="color:#C9A86A;font-size:10px;font-weight:800;margin-top:12px;display:block">EVENT</label>
      <input id="cEvent" placeholder="Gold Membership 2024" value="Gold Membership 2024" oninput="drawCert()">

      <label style="color:#C9A86A;font-size:10px;font-weight:800;margin-top:12px;display:block">CERTIFICATE ID</label>
      <input id="cId" value="LEO-GOLD-2024-001">

      <button onclick="downloadCert()" style="width:100%;margin-top:16px;background:linear-gradient(90deg,#FFD700,#FFC400);color:#000;padding:14px;border-radius:100px;border:none;font-weight:900;cursor:pointer;box-shadow:0 8px 25px rgba(255,215,0,0.4)">📥 Download Certificate (PNG)</button>
      
      <button onclick="downloadCertPDF()" style="width:100%;margin-top:8px;background:transparent;border:1.5px solid #FFD700;color:#FFD700;padding:12px;border-radius:100px;font-weight:800;font-size:12px;cursor:pointer">📄 Download as PDF (Print)</button>

      <button onclick="shareCert()" style="width:100%;margin-top:8px;background:#25D366;color:#fff;padding:12px;border-radius:100px;border:none;font-weight:800;font-size:12px;cursor:pointer">💚 Share with Channel Link</button>

      <p id="status" style="color:#22C55E;font-size:11px;text-align:center;margin-top:10px;display:none">✅ Downloaded!</p>
    </div>

    <!-- PREVIEW CANVAS -->
    <div>
      <p style="color:#8DA2C3;font-size:11px;letter-spacing:2px">LIVE PREVIEW - This is what will download</p>
      <canvas id="certCanvas" width="1056" height="730" style="width:100%;border-radius:12px;margin-top:10px;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:4px solid #FFD700"></canvas>
      <p style="color:#6B7280;font-size:9px;text-align:center;margin-top:8px">💎 Gold foil border • Channel link included • High quality PNG</p>
    </div>

  </div>
</div>

<script>
const canvas = document.getElementById('certCanvas');
const ctx = canvas.getContext('2d');

function drawCert(){
  const name = document.getElementById('cName').value || 'Leo Ashen Perera';
  const badge = document.getElementById('cBadge').value || 'GOLD LEO - FOUNDER';
  const event = document.getElementById('cEvent').value || 'Gold Membership 2024';
  const id = document.getElementById('cId').value || 'LEO-GOLD-2024-001';
  const date = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

  // Background
  ctx.fillStyle = '#FFFEF5'; ctx.fillRect(0,0,1056,730);
  
  // Gold border top/bottom
  const grad = ctx.createLinearGradient(0,0,1056,0);
  grad.addColorStop(0,'#FFD700'); grad.addColorStop(0.5,'#FFA500'); grad.addColorStop(1,'#FFD700');
  ctx.fillStyle = grad; ctx.fillRect(0,0,1056,18); ctx.fillRect(0,712,1056,18);

  // Inner border
  ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 4; ctx.strokeRect(20,36,1016,658);
  ctx.strokeStyle = '#0A1931'; ctx.lineWidth = 1; ctx.strokeRect(28,44,1000,642);

  // Header
  ctx.fillStyle = '#0A1931'; ctx.font = '900 28px Outfit'; ctx.textAlign='center';
  ctx.fillText('🎯 LEO CLUB A/W.H.C • LEO MEMBER', 528, 90);
  
  ctx.fillStyle = '#0A1931'; ctx.font = '900 48px Playfair Display'; 
  ctx.fillText('CERTIFICATE', 528, 150);
  
  ctx.fillStyle = '#C9A86A'; ctx.font = '800 16px Outfit'; ctx.letterSpacing = '4px';
  ctx.fillText('OF APPRECIATION', 528, 175);

  ctx.fillStyle = '#FFD700'; ctx.fillRect(478,190,100,4);

  // Presented to
  ctx.fillStyle = '#6B7280'; ctx.font = '600 14px Outfit'; 
  ctx.fillText('PROUDLY PRESENTED TO', 528, 230);

  ctx.fillStyle = '#0A1931'; ctx.font = '900 38px Playfair Display';
  ctx.fillText(name.toUpperCase(), 528, 275);

  // Badge background
  ctx.fillStyle = '#0A1931'; 
  const badgeW = ctx.measureText('💎 '+badge).width + 40;
  ctx.beginPath(); ctx.roundRect(528-badgeW/2, 295, badgeW, 36, 18); ctx.fill();
  ctx.fillStyle = '#FFD700'; ctx.font = '800 13px Outfit';
  ctx.fillText('💎 '+badge, 528, 317);

  // Event
  ctx.fillStyle = '#4B5563'; ctx.font = '500 15px Outfit';
  ctx.fillText(event, 528, 360);

  // Channel link - IMPORTANT
  ctx.fillStyle = '#25D366'; ctx.font = '700 13px Outfit';
  ctx.fillText('💚 Follow: https://whatsapp.com/channel/0029Vb8bIYv17EmtzlqEVC3B', 528, 390);

  // Date & ID
  ctx.fillStyle = '#6B7280'; ctx.font = '600 12px Outfit';
  ctx.fillText(`${date}  |  ID: ${id}`, 528, 420);

  // Signatures
  ctx.fillStyle = '#000'; ctx.fillRect(120,500,160,2); ctx.fillRect(776,500,160,2);
  ctx.fillStyle = '#0A1931'; ctx.font = '800 14px Outfit'; ctx.textAlign='center';
  ctx.fillText('PRESIDENT', 200, 525); ctx.fillText('DATE', 856, 525);
  ctx.fillStyle = '#6B7280'; ctx.font = '500 11px Outfit';
  ctx.fillText('Leo Club Colombo', 200, 542);
  ctx.fillText(date, 856, 542);

  // QR placeholder for channel
  ctx.fillStyle = '#0A1931'; ctx.fillRect(483,460,90,90);
  ctx.fillStyle = '#25D366'; ctx.font = '700 28px Outfit'; ctx.textAlign='center';
  ctx.fillText('', 528, 515);
  ctx.fillStyle = '#fff'; ctx.font = '600 8px Outfit';
  ctx.fillText('SCAN TO', 528, 530); ctx.fillText('FOLLOW', 528, 540);
}

function downloadCert(){
  const name = (document.getElementById('cName').value || 'LeoMember').replace(/\s+/g,'_');
  const id = document.getElementById('cId').value;
  const link = document.createElement('a');
  link.download = `${name}_Gold_Certificate_${id}.png`;
  link.href = canvas.toDataURL('image/png',1.0);
  link.click();
  showStatus();
}

function downloadCertPDF(){
  // Print as PDF - browser print
  const win = window.open('');
  win.document.write(`<img src="${canvas.toDataURL()}" style="width:100%"><script>window.print();setTimeout(()=>window.close(),500)<\/script>`);
}

function shareCert(){
  const name = document.getElementById('cName').value || 'Gold Member';
  const channel = "https://whatsapp.com/channel/0029Vb8bIYv17EmtzlqEVC3B";
  const text = `🎓 *Gold Certificate Generated!* 💎\n\n👑 ${name} certified!\n📜 ID: ${document.getElementById('cId').value}\n\nCertificate downloaded ✅\n\n💚 Follow channel:\n${channel}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
}

function showStatus(){
  const s = document.getElementById('status'); s.style.display='block';
  setTimeout(()=>s.style.display='none',3000);
}

// Init
document.getElementById('cId').value = `LEO-GOLD-${new Date().getFullYear()}-${String(Math.floor(Math.random()*900)+100).padStart(3,'0')}`;
drawCert();
</script>
</body>
</html>
